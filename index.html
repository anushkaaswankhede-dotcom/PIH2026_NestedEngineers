<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carbon Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #060d08;
    --panel: #0e1a10;
    --panel2: #111f14;
    --border: #1a3320;
    --green: #22c55e;
    --lime: #a3e635;
    --yellow: #fbbf24;
    --orange: #f97316;
    --red: #ef4444;
    --text: #dff0e4;
    --muted: #5a7f62;
    --accent: #4ade80;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }

  /  HEADER  /
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; height:44px; border-bottom:1px solid var(--border);
    background:var(--panel); z-index:1000; flex-shrink:0;
  }
  .logo { display:flex; align-items:center; gap:8px; }
  .logo-icon { width:30px;height:30px; background:var(--green); border-radius:7px; display:flex;align-items:center;justify-content:center; font-size:16px; }
  .logo h1 { font-size:1.1rem; font-weight:800; }
  .logo h1 span { color:var(--green); }
  .tagline { font-family:'Space Mono',monospace; font-size:0.58rem; color:var(--muted); }

  
  .topbar-right {
    display:flex; align-items:center; gap:20px;
    font-family:'Space Mono',monospace; font-size:0.72rem;
  }
  .topbar-city { font-weight:700; font-size:0.82rem; color:var(--text); display:flex;align-items:center;gap:6px; }
  .topbar-stat { display:flex;align-items:center;gap:5px; }
  .dot-green { width:8px;height:8px;border-radius:50%;background:var(--green); }
  .dot-orange { width:8px;height:8px;border-radius:50%;background:var(--orange); }

 
  .main { display:flex; flex:1; overflow:hidden; }

 
  .sidebar {
    width:268px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow-y:auto; flex-shrink:0; z-index:500;
  }
  .sidebar::-webkit-scrollbar { width:3px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border); }

  .sb-section { padding:12px 14px; border-bottom:1px solid var(--border); }
  .sb-label { font-size:0.62rem; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }

 
  .loc-row { display:flex;align-items:center;gap:6px; font-size:0.78rem; color:var(--muted); margin-bottom:8px; }
  .loc-row span { color:var(--text); font-weight:600; }

 
  .search-wrap { position:relative; margin-bottom:8px; }
  .search-wrap input {
    width:100%; background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px 8px 32px;
    color:var(--text); font-family:'Space Mono',monospace; font-size:0.76rem; outline:none;
  }
  .search-wrap input:focus { border-color:var(--green); }
  .search-wrap input::placeholder { color:var(--muted); }
  .search-icon { position:absolute;left:10px;top:50%;transform:translateY(-50%); font-size:0.9rem; color:var(--muted); }
  .search-results {
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    z-index:9999; max-height:180px; overflow-y:auto; display:none;
  }
  .search-results.open { display:block; }
  .sr-item { padding:8px 12px; font-size:0.78rem; cursor:pointer; border-bottom:1px solid var(--border); }
  .sr-item:hover { background:var(--border); }
  .sr-item:last-child { border-bottom:none; }
  .sr-state { font-size:0.65rem; color:var(--muted); }

 
  .loc-btn {
    width:100%; padding:8px; background:transparent;
    border:1px solid var(--green); border-radius:8px;
    color:var(--green); font-family:'Syne',sans-serif; font-weight:700; font-size:0.78rem;
    cursor:pointer; display:flex;align-items:center;justify-content:center;gap:6px;
    transition:all 0.2s;
  }
  .loc-btn:hover { background:var(--green); color:#000; }
  .loc-btn.loading { opacity:0.6; cursor:wait; }

  
  .radius-btns { display:flex; gap:6px; flex-wrap:wrap; }
  .rbtn {
    flex:1; padding:6px 4px; text-align:center;
    background:var(--panel2); border:1px solid var(--border); border-radius:6px;
    font-size:0.72rem; font-weight:600; cursor:pointer; color:var(--muted);
    transition:all 0.2s; font-family:'Space Mono',monospace;
  }
  .rbtn:hover { border-color:var(--green); color:var(--text); }
  .rbtn.active { background:var(--green); color:#000; border-color:var(--green); }

  
  .toggle-row { display:flex; gap:6px; }
  .tbtn {
    flex:1; padding:7px 6px; text-align:center; border-radius:8px;
    font-size:0.72rem; font-weight:700; cursor:pointer; transition:all 0.2s;
    border:1px solid var(--border); background:var(--panel2); color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .tbtn.active-tree { background:#14532d; border-color:var(--green); color:var(--green); }
  .tbtn.active-co2  { background:#431407; border-color:var(--orange); color:var(--orange); }
